<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>waPilot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>waPilot</h1>
    <p>WhatsApp Message Assistant</p>

    <section class="card">
      <h2>WhatsApp Connection</h2>
      <p id="status">Checking connection...</p>
      <img id="qr" alt="WhatsApp QR Code" hidden>
      <button id="refresh">Refresh Status</button>
    </section>

    <section class="card">
      <h2>Message Settings</h2>

      <label for="contact">Select Contact</label>
      <select id="contact">
        <option value="">Loading contacts...</option>
      </select>

      <label for="message">Message</label>
      <input id="message" value="Sorry" maxlength="200">

      <label for="count">Message Count (1–3)</label>
      <input id="count" type="number" min="1" max="3" value="3">

      <label for="interval">Interval (seconds, minimum 60)</label>
      <input id="interval" type="number" min="60" max="3600" value="60">

      <button id="start">Start</button>
      <button id="stop">Stop</button>
      <p id="result"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
        </html>
